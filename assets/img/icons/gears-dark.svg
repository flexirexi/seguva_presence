<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 64 64"
    aria-hidden="true"
>
    <defs>
        <g id="gear">
            <g fill="#212529">
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(45)"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(90)"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(135)"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(180)"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(225)"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(270)"/>
                <rect x="-2.2" y="-19" width="4.4" height="8" rx="0.8" transform="rotate(315)"/>
                <circle r="13.5"/>
            </g>

            <circle r="6.2" fill="#ececec"/>
            <circle r="6.2" fill="none" stroke="#212529" stroke-width="2"/>
        </g>
    </defs>

    <!-- Top gear -->
    <use href="#gear" transform="translate(34 13) scale(0.58)"/>

    <!-- Left large gear -->
    <use href="#gear" transform="translate(20 40) scale(1.00)"/>

    <!-- Right gear -->
    <use href="#gear" transform="translate(50 34) scale(0.71)"/>
</svg>