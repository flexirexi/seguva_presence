<!DOCTYPE html>
<html data-theme="dark" data-lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Favicon -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- stylesheet -->
        <link rel="stylesheet" href="assets/css/main.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg  fixed-top navbar-dark">
            <div class="container ">
                <div class="nav-inner-container d-flex ">
                    <a class="navbar-brand d-flex align-items-center" href="#">
                        <img src="assets/img/logos/seguva-logo-gb-none.png" alt="Seguva Logo" height="40" class="me-2">
                    </a>
                    
                    <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                </div>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ">
                        <li class="nav-item"><a class="nav-link" href="index.html" style="color: #ffffff; font-weight:450;">Home</a></li>
                        <li class="nav-item"><a data-lang="tTeam" class="nav-link" href="team.html">Team</a></li>
                        <li class="nav-item"><a data-lang="tStrategy" class="nav-link" href="strategy.html">Strategy</a></li>
                        <li class="nav-item"><a data-lang="tProducts" class="nav-link" href="products.html">Products</a></li>
                        <li class="nav-item"><a data-lang="tContact" class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item">
                            <a id="btContactDesktop" href="contact.html" class="btn btn-primary" data-lang="tNavContact">Book a demo</a>
                        </li>
                        <li class="nav-item">
                            <button class="toggle btn btn-outline-light" id="theme-toggle" >
                                <img src="assets/img/icons/fa-sun-solid-full-light.svg" alt="" width="23" height="23" ></img> <!-- Standard Icon für Dark Mode -->
                            </button>
                        </li>
                        <li class="nav-item dropdown">
                            <button 
                                class="btn btn-outline-light toggle dropdown-toggle" 
                                type="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                id="language-toggle">
                                DE
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="language-toggle">
                                <li>
                                    <button class="dropdown-item" type="button" data-language="de">
                                        DE
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button" data-language="en">
                                        EN
                                    </button>
                                </li>
                                <li>
                                    <button class="dropdown-item" type="button" data-language="es">
                                        ES
                                    </button>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="container py-4">

            <ul class="nav nav-tabs" id="productTabs" role="tablist">

                <li class="nav-item" role="presentation">
                    <button
                        class="nav-link active"
                        id="product-a-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#product-a"
                        type="button"
                        role="tab"
                        aria-controls="product-a"
                        aria-selected="true"
                    >
                        Product A
                    </button>
                </li>

                <li class="nav-item" role="presentation">
                    <button
                        class="nav-link"
                        id="product-b-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#product-b"
                        type="button"
                        role="tab"
                        aria-controls="product-b"
                        aria-selected="false"
                    >
                        Product B
                    </button>
                </li>

                <li class="nav-item" role="presentation">
                    <button
                        class="nav-link"
                        id="product-c-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#product-c"
                        type="button"
                        role="tab"
                        aria-controls="product-c"
                        aria-selected="false"
                    >
                        Product C
                    </button>
                </li>

            </ul>


            <div class="tab-content pt-4" id="productTabsContent">

                <section
                    class="tab-pane fade show active"
                    id="product-a"
                    role="tabpanel"
                    aria-labelledby="product-a-tab"
                    tabindex="0"
                >
                    <h1>Product A</h1>
                    <p>Inhalt für Product A.</p>
                </section>


                <section
                    class="tab-pane fade"
                    id="product-b"
                    role="tabpanel"
                    aria-labelledby="product-b-tab"
                    tabindex="0"
                >
                    <h1>Product B</h1>
                    <p>Inhalt für Product B.</p>
                </section>


                <section
                    class="tab-pane fade"
                    id="product-c"
                    role="tabpanel"
                    aria-labelledby="product-c-tab"
                    tabindex="0"
                >
                    <h1>Product C</h1>
                    <p>Inhalt für Product C.</p>
                </section>

            </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
